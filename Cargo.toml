[package]
name = "nanonis-tcp"
version = "0.1.0"
edition = "2024"

[features]
tokio = ["dep:tokio"]
v5e = []

[dependencies]
macro_rules_attribute = "0.2.2"
num_enum = "0.7.5"
thiserror = "2.0.18"
tokio = { version = "1.50.0", default-features = false, features = [
    "io-util",
    "net",
    "sync",
], optional = true }

[dev-dependencies]
console-subscriber = "0.5.0"
tokio = { version = "1.50.0", default-features = false, features = [
    "rt",
    "macros",
] }
